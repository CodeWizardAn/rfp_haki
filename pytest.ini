[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    database: Database tests
    normalizer: Normalizer tests

# Options
addopts = -v --tb=short --strict-markers

# Coverage settings (when using pytest-cov)
# Run with: pytest --cov=agents --cov=database --cov-report=html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for individual tests (requires pytest-timeout)
timeout = 30

# Async mode (requires pytest-asyncio)
asyncio_mode = auto
