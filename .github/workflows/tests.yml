name: Enterprise SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Linting, Static Analysis & Tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit safety

    - name: Security scan with Bandit
      run: |
        bandit -r api/ core/ agents/ database/ -ll -q

    - name: Run unit & integration tests with coverage
      run: |
        pytest tests/ -v --tb=short --cov=api --cov=core --cov=agents --cov=database --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Lint, TypeScript Type-Check & Production Build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: haki-fmcg-frontend/package.json

    - name: Install Frontend Dependencies
      run: |
        cd haki-fmcg-frontend
        npm install

    - name: TypeScript Compilation & Production Build
      run: |
        cd haki-fmcg-frontend
        npm run build

  # ---------------------------------------------------------------------------
  # 3. Docker Container Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: haki-backend:test
