version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Primary PostgreSQL Database (ACID Store + pgvector)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: haki_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haki_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haki_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-haki_fmcg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haki_admin} -d ${POSTGRES_DB:-haki_fmcg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haki_net

  # ---------------------------------------------------------------------------
  # 2. Redis Distributed Cache & Celery Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: haki_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - haki_net

  # ---------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Cloud Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: haki_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - haki_net

  # ---------------------------------------------------------------------------
  # 4. FastAPI Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haki_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-haki_admin}:${POSTGRES_PASSWORD:-haki_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-haki_fmcg}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_BUCKET_NAME=rfp-documents
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - haki_net

  # ---------------------------------------------------------------------------
  # 5. Celery Asynchronous Worker Cluster
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haki_worker
    restart: always
    command: celery -A core.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-haki_admin}:${POSTGRES_PASSWORD:-haki_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-haki_fmcg}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - STORAGE_BACKEND=s3
      - S3_BUCKET_NAME=rfp-documents
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haki_net

  # ---------------------------------------------------------------------------
  # 6. Hardened React Frontend + Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./haki-fmcg-frontend
      dockerfile: Dockerfile
    container_name: haki_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - haki_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  haki_net:
    driver: bridge
