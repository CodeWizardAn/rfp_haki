<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favShield" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080F1F"/>
    </linearGradient>
    <linearGradient id="favBorder" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="favCopper" x1="26" y1="20" x2="48" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="favNeural" x1="72" y1="20" x2="94" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="favBridge" x1="38" y1="60" x2="82" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#favShield)"/>
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="url(#favBorder)" stroke-width="4"/>

  <!-- Left Conductor Pillar -->
  <rect x="28" y="24" width="16" height="72" rx="6" fill="url(#favCopper)"/>
  <line x1="30" y1="40" x2="42" y2="40" stroke="#FFF" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="30" y1="80" x2="42" y2="80" stroke="#FFF" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="33" y1="26" x2="33" y2="94" stroke="#FEF08A" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Right Neural Pillar -->
  <rect x="76" y="24" width="16" height="72" rx="6" fill="url(#favNeural)"/>
  <line x1="79" y1="26" x2="79" y2="94" stroke="#93C5FD" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="84" cy="38" r="3" fill="#FFFFFF"/>
  <circle cx="84" cy="82" r="3" fill="#FFFFFF"/>

  <!-- Center Bridge -->
  <rect x="40" y="52" width="40" height="16" rx="3" fill="url(#favBridge)"/>
  <polygon points="60,46 66,60 60,74 54,60" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="2.5" fill="#2563EB"/>
</svg>
